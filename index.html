<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Login Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <div class="grid"></div>
      <span class="orb orb-one"></span>
      <span class="orb orb-two"></span>
      <span class="orb orb-three"></span>
    </div>

    <main class="app-shell">
      <section class="brand-panel">
        <div class="brand-badge">N</div>
        <h1>Welcome back.</h1>
        <p>Step into a calm, intelligent workspace designed for momentum.</p>
        <ul class="feature-list">
          <li>Instant synchronization</li>
          <li>Biometric-ready security</li>
          <li>Adaptive AI assistance</li>
        </ul>
      </section>

      <section class="login-card" id="loginCard">
        <div class="card-glow"></div>
        <div class="card-header">
          <p class="eyebrow">Secure access</p>
          <h2>Login</h2>
          <p>Enter your credentials to continue</p>
        </div>

        <form id="loginForm">
          <label class="input-group">
            <span class="icon">✉</span>
            <input type="email" id="email" placeholder="Email address" required />
          </label>

          <label class="input-group password-group">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="Password" required />
            <button type="button" class="eye" id="togglePassword" aria-label="Toggle password visibility">
              👁
            </button>
          </label>

          <div class="options">
            <label class="checkbox">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn">Enter the portal</button>
        </form>

        <div class="status" id="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
