{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Auth Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}" />
</head>
<body>
    <div class="bg-pattern" aria-hidden="true"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-icon">A</div>
                <h1>Welcome Back</h1>
                <p class="brand-sub">Sign in to continue to your account</p>
            </div>

            <form method="POST" action="{% url 'login' %}" class="auth-form">
                {% csrf_token %}

                {% if form.non_field_errors %}
                <div class="form-error">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
                {% endif %}

                <div class="input-group">
                    <label for="id_username">Email or Username</label>
                    <input type="text" name="username" id="id_username" placeholder="Enter your email or username" required autofocus />
                </div>

                <div class="input-group">
                    <label for="id_password">Password</label>
                    <div class="password-wrap">
                        <input type="password" name="password" id="id_password" placeholder="Enter your password" required />
                        <button type="button" class="toggle-pass" onclick="togglePassword()" aria-label="Toggle visibility">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>

                <p class="auth-alt">
                    Don't have an account?
                    <a href="{% url 'register' %}">Create one</a>
                </p>
            </form>
        </div>
    </main>

    <script src="{% static 'accounts/js/script.js' %}"></script>
</body>
</html>
